name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, ubuntu-24.04-arm, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install fish and zsh
        if: matrix.os == 'ubuntu-24.04'
        run: sudo apt-get update && sudo apt-get install -y fish zsh
      - run: go test ./... -race

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  vuln:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  shell-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make shell-test

  install-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make install-test

  scheduler-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Ensure crontab exists
        if: runner.os == 'Linux'
        run: command -v crontab || (sudo apt-get update && sudo apt-get install -y cron)
      - name: Install, check and remove the real scheduler entry
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/oci-assume"
          go build -o "$bin" ./cmd/oci-assume
          export OCI_ASSUME_STATE_DIR="$RUNNER_TEMP/state"
          mkdir -p "$OCI_ASSUME_STATE_DIR"
          # Linux keeps the runner's real HOME: the systemd user manager only reads units under its own config dir.
          if [ "$RUNNER_OS" = macOS ]; then
            export HOME="$RUNNER_TEMP/home"
            mkdir -p "$HOME"
          fi
          "$bin" daemon install
          "$bin" daemon status | tee "$RUNNER_TEMP/status.txt"
          grep -q '^installed: yes$' "$RUNNER_TEMP/status.txt"
          if [ "$RUNNER_OS" = Linux ]; then
            if mgr_env=$(systemctl --user show-environment 2>/dev/null); then
              # The manager's XDG_CONFIG_HOME decides the unit dir, not the shell's.
              mgr_xdg=$(printf '%s\n' "$mgr_env" | sed -n 's/^XDG_CONFIG_HOME=//p' | tail -n1)
              unit_dir="${mgr_xdg:-$HOME/.config}/systemd/user"
              grep -qx "path: $unit_dir/oci-assume.timer" "$RUNNER_TEMP/status.txt"
              systemctl --user is-enabled oci-assume.timer
              systemctl --user is-active oci-assume.timer
            else
              crontab -l | grep -q '# oci-assume$'
            fi
          fi
          "$bin" daemon uninstall
          if [ "$RUNNER_OS" = macOS ]; then
            if launchctl print "gui/$(id -u)/io.github.123yogin.oci-assume" >/dev/null 2>&1; then
              echo "launchd agent still loaded"; exit 1
            fi
            test ! -e "$HOME/Library/LaunchAgents/io.github.123yogin.oci-assume.plist"
          else
            test ! -e "$unit_dir/oci-assume.timer"
            test ! -e "$unit_dir/oci-assume.service"
            if systemctl --user is-enabled oci-assume.timer >/dev/null 2>&1; then
              echo "timer still enabled"; exit 1
            fi
            if crontab -l 2>/dev/null | grep -q '# oci-assume'; then
              echo "cron line left"; exit 1
            fi
          fi

  goreleaser-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: check

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
